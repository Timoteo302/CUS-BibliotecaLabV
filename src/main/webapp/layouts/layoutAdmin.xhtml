<?xml version='1.0' encoding='UTF-8' ?> 
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:c="jakarta.tags.core">

    <h:head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

        <h:outputStylesheet library="css" name="style.css"/>

        <title>Biblioteca | Admin</title>
    </h:head>

    <h:body>

        <header class="header">


            <!-- IZQUIERDA -->
            <div class="header-left">

                <h1 class="titulo">Administracion Biblioteca</h1>


                <nav class="nav">

                    <h:link value="Prestamos" outcome="/admin/prestamosA"/>
                    <h:link value="Libros" outcome="/admin/librosA"/>
                    <h:link value="Autores" outcome="/admin/autoresA"/>
                    <h:link value="Categorias" outcome="/admin/categoriasA"/>
                    <h:link value="Socios" outcome="/admin/sociosA"/>
                    <h:link value="Mostrador" outcome="/admin/mostradorA" />
                    <h:link value="Consultas" outcome="/admin/consultasA"/>

                </nav>


            </div>


            <div class="header-right">
                <div>
                    <h:link styleClass="enlace boton2oscuro" value="Ir a Biblioteca" outcome="/index"/>
                </div>
                
                <!-- LOGOUT -->

                <h:form>

                    <h:commandLink
                        styleClass="cerrar"
                        value="Cerrar sesion"
                        action="#{usuarioBean.logout}"/>

                </h:form>
                
            </div>


        </header>


        <main class="contenedor">

            <section>
                <ui:insert name="contenido"/>
            </section>

        </main>


        <footer class="footer">

            <div class="footer-info">
                <p>Administracion de datos de la Biblioteca - @2026</p>
            </div>

        </footer>

    </h:body>

</html>
